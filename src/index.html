<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>HelpDesk</title>
  </head>
  <body>
    <div id="root" class="widget .state-loading">
      <div class="plug">
        <h1 class="plug-header">Новости мира и кино</h1>
        <button class="refresh">Обновить</button>
        <div class="plug-card">
          <div class="plug-item title "></div>
          <div class="plug-item-group">
            <div class="plug-item plug-avatar"></div>            
            <div class="plug-item-boxnews">
              <span class="plug-item plug-text"></span>
              <span class="plug-item plug-text"></span>
           </div>
          </div>          
        </div>
        <div class="plug-card">
          <div class="plug-item title "></div>
          <div class="plug-item-group">
            <div class="plug-item plug-avatar"></div>            
            <div class="plug-item-boxnews">
              <span class="plug-item plug-text"></span>
              <span class="plug-item plug-text"></span>
           </div>
          </div>          
        </div>
        <div class="plug-card">
          <div class="plug-item title "></div>
          <div class="plug-item-group">
            <div class="plug-item plug-avatar"></div>            
            <div class="plug-item-boxnews">
              <span class="plug-item plug-text"></span>
              <span class="plug-item plug-text"></span>
           </div>
          </div>          
        </div>
      </div>    
      <div class="error-massage">        
          <span class="error-massage__text">Не удалось загрузить данные</span>
          <span class="error-massage__text-check">Проверьте подключение и обновите страницу</span>
      </div>
      <div class="news">
        <h1 class="news-header">Новости мира и кино</h1>
        <button class="refresh">Обновить</button>
      </div>      
    </div>
  </body>
</html>
